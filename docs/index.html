<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Party Connections</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <header>
        <h1>Party Connections</h1>

        <p>
            Explore how everyone at the party is connected.
        </p>
    </header>


    <main class="layout">

        <!-- ==========================================
             GRAPH
        =========================================== -->

        <section class="graph-container">

            <svg id="network"></svg>

        </section>


        <!-- ==========================================
             SIDEBAR
        =========================================== -->

        <aside id="details-panel">


            <!-- ======================================
                 PERSON DETAILS
            ======================================= -->

            <section id="person-section">

                <h2>
                    Person Details
                </h2>

                <p
                    id="person-hint"
                    class="hint"
                >
                    Select someone from the graph.
                </p>

                <div id="person-details"></div>

            </section>


            <!-- ======================================
                 COMMUNITY LEGEND
            ======================================= -->

            <section
                id="community-section"
                class="community-section"
            >

                <h2>
                    Detected Communities
                </h2>

                <div id="community-legend"></div>

                <p class="legend-description">
                    Colors represent communities detected
                    from the network's connection structure.
                </p>

            </section>


            <!-- ======================================
                 RELATIONSHIP FILTERS
            ======================================= -->

            <section
                id="filter-section"
                class="filter-section"
            >

                <h2>
                    Connections
                </h2>

                <div id="relationship-filters"></div>

                <button id="show-all-button">
                    Show All
                </button>

            </section>

        </aside>

    </main>


    <!-- D3 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- Application -->
    <script src="app.js"></script>

</body>

</html>
